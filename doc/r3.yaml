filetype: r3

detect:
    filename: "\\.r3$"

rules:
    - comment:
        start: "\\\\"
        end: "$"
    - constant.number: "(%[0-9a-fA-F]+|\\$[0-9a-fA-F]+|[0-9]+)"
    - string:
        start: "\""
        end: "\""
        skip: "\\\\."
    - symbol: "(\\(|\\)|\\{|\\}|\\[|\\])"
    
    # Prefijos individuales
    - r3.colon: ":\\S*"
    - r3.hash: "#\\S*"
    - r3.caret: "\\^\\S*"
    - r3.quote: "'\\S*"

    - statement: "\\b(ex|dup|drop|swap|over|rot|-rot|nip|pick2|pick3|pick4|2dup|2drop|3drop|4drop|2over|2swap|>r|r>|r@|\\+|\\-|\\*|/|<<|>>|>>>|\\*/|and|or|xor|nand|not|neg|mod|/mod|\\*>>|<<\\/|abs|sqrt|clz|@|c@|w@|d@|@\\+|c@\\+|w@\\+|d@\\+|!|c!|w!|d!|!\\+|c!\\+|w!\\+|d!\\+|\\+!|c\\+!|w\\+!|d\\+!|>a|a>|a\\+|a@|a!|a@\\+|a!\\+|ca@|ca!|ca@\\+|ca!\\+|da@|da!|da@\\+|da!\\+|>b|b>|b\\+|b@|b!|b@\\+|b!\\+|cb@|cb!|cb@\\+|cb!\\+|db@|db!|db@\\+|db!\\+|move|move>|fill|cmove|cmove>|cfill|dmove|dmove>|dfill|mem|loadlib|getproc|sys0|sys1|sys2|sys3|sys4|sys5|sys6|sys7|sys8|sys9|sys10)\\b"
    - special: "\\b(0\\?|1\\?|\\+\\?|\\-\\?|\\=\\?|\\<\\>\\?|\\>\\?|\\<\\?|\\>=\\?|\\<=\\?|and\\?|nand\\?|in\\?)\\b"